<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تذاكر السينما | Cinema Ticket Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --input-border: #475569;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-card) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { text-align: center; color: var(--accent); margin-bottom: 24px; font-size: 1.6rem; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: var(--text-muted); }
        input, select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border);
            background: var(--bg-dark); color: #fff; font-size: 1rem; outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .field-error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; cursor: pointer; }
        .checkbox-group input { width: auto; accent-color: var(--accent); transform: scale(1.2); }
        button {
            width: 100%; padding: 14px; background: var(--accent); color: var(--bg-dark); border: none;
            border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: var(--accent-hover); }
        #result-box { margin-top: 24px; padding: 16px; border-radius: 8px; background: var(--bg-dark); border: 1px solid var(--border-color); display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .result-item span.amount { direction: ltr; unicode-bidi: embed; }
        .result-total { border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px; font-weight: bold; font-size: 1.2rem; color: var(--success); }
        .error-message { color: var(--error); font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 حاسبة تذاكر السينما</h1>

    <div class="form-group">
        <label for="age">العمر:</label>
        <input type="number" id="age" value="21" min="1" max="100">
        <div class="field-error" id="age-error">من فضلك أدخلي عمر صحيح بين 1 و 100</div>
    </div>

    <div class="form-group">
        <label for="seat">نوع المقعد:</label>
        <select id="seat">
            <option value="Premium">Premium ($5 رسوم)</option>
            <option value="Gold" selected>Gold ($3 رسوم)</option>
            <option value="Regular">Regular ($1 رسوم)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="showTime">وقت العرض:</label>
        <select id="showTime">
            <option value="Evening" selected>مسائي - Evening (+$2)</option>
            <option value="Matinee">صباحي - Matinee</option>
        </select>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="isMember">
        <label for="isMember">لدي عضوية (خصم $3 لسن 21+)</label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="isWeekend">
        <label for="isWeekend">عرض نهاية الأسبوع (+$2)</label>
    </div>

    <button onclick="calculateTicket()">احسب السعر النهائي</button>

    <div id="result-box"></div>
</div>

<script>
    function calculateTicket() {
        const basePrice = 15;
        const ageInput = document.getElementById('age');
        const ageError = document.getElementById('age-error');
        const ageValue = ageInput.value.trim();
        const age = parseInt(ageValue, 10);

        const resultBox = document.getElementById('result-box');

        // Validate age input
        if (ageValue === '' || isNaN(age) || age < 1 || age > 100) {
            ageError.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        } else {
            ageError.style.display = 'none';
        }

        const seatType = document.getElementById('seat').value;
        const showTime = document.getElementById('showTime').value;
        const isMember = document.getElementById('isMember').checked;
        const isWeekend = document.getElementById('isWeekend').checked;

        resultBox.style.display = 'block';

        const canBook = age >= 21 || (age >= 18 && (showTime !== 'Evening' || isMember));

        if (!canBook) {
            resultBox.innerHTML = `<div class="error-message">❌ عذراً، لا تستوفي شروط العمر أو وقت العرض لحجز هذه التذكرة.</div>`;
            return;
        }

        let discount = 0;
        if (isMember && age >= 21) { discount = 3; }

        let extraCharges = 0;
        if (isWeekend || showTime === 'Evening') { extraCharges = 2; }

        let serviceCharges = 1;
        if (seatType === 'Premium') { serviceCharges = 5; }
        else if (seatType === 'Gold') { serviceCharges = 3; }

        const finalPrice = basePrice + extraCharges + serviceCharges - discount;

        resultBox.innerHTML = `
            <div class="result-item"><span>السعر الأساسي:</span> <span class="amount">$${basePrice}</span></div>
            <div class="result-item"><span>رسوم إضافية:</span> <span class="amount">+$${extraCharges}</span></div>
            <div class="result-item"><span>رسوم الخدمة (${seatType}):</span> <span class="amount">+$${serviceCharges}</span></div>
            <div class="result-item"><span>الخصم:</span> <span class="amount">-$${discount}</span></div>
            <div class="result-item result-total"><span>السعر النهائي:</span> <span class="amount">$${finalPrice}</span></div>
        `;
    }
</script>

</body>
</html>
